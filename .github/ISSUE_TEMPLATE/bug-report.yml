name: Bug report
description: Report incorrect Repa behavior
title: "[BUG]: "
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
      placeholder: Tell us what Repa did and what you were trying to do.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence you know.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect Repa to do instead?
    validations:
      required: false

  - type: input
    id: repa-revision
    attributes:
      label: Repa revision
      description: Commit or build identifier, if known.
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, Ubuntu 24.04, macOS 15
    validations:
      required: false

  - type: input
    id: terminal
    attributes:
      label: Terminal
      placeholder: e.g. Windows Terminal, Ghostty, Alacritty
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots
      description: Attach evidence directly and redact secrets, private learner data, and private source material.
    validations:
      required: false
