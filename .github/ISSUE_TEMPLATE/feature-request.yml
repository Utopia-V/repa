name: Feature request
description: Propose a Repa product or engineering improvement
title: "[FEATURE]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What learner or maintainer problem should Repa solve?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Intended outcome
      description: Describe the behavior or result that would address the problem.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context and constraints
      description: Include relevant workflows, evidence, trade-offs, or deliberate exclusions.
    validations:
      required: false

  - type: checkboxes
    id: current-authority
    attributes:
      label: Current documentation
      options:
        - label: I checked the current Repa documentation map and am not relying on inherited OpenCode or preview-v2 material as product authority.
          required: true
